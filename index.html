<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF View & Download</title>
    <style>
        :root {
            --primary-color: #111827;
            --primary-hover: #000000;
            --bg-color: #f5f5f4;
            --card-bg: #ffffff;
            --text-color: #111827;
            --border-color: #d6d3d1;
            --muted-color: #6b7280;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background: linear-gradient(180deg, #f8f8f7 0%, #f3f4f6 100%);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: rgba(255, 255, 255, 0.94);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(8px);
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        h1 {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .controls {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.62rem 1rem;
            font-size: 0.88rem;
            font-weight: 600;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.18s ease;
            text-decoration: none;
            border: 1px solid transparent;
            line-height: 1;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-outline {
            background-color: transparent;
            border-color: var(--border-color);
            color: var(--text-color);
        }

        .btn-outline:hover {
            background-color: #f3f4f6;
            border-color: #a1a1aa;
        }

        .btn-small {
            padding: 0.4rem 0.7rem;
            font-size: 0.8rem;
        }

        .btn[disabled] {
            opacity: 0.55;
            cursor: not-allowed;
            pointer-events: none;
        }

        input[type="file"] {
            display: none;
        }

        main {
            flex: 1;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            max-width: 1280px;
            width: 100%;
            margin: 0 auto;
        }

        .status-bar {
            padding: 0.75rem 1rem;
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            font-size: 0.86rem;
            color: var(--muted-color);
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .status-bar.is-error {
            color: #b91c1c;
            border-color: #fecaca;
            background-color: #fef2f2;
        }

        .viewer-container {
            flex: 1;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 70vh;
        }

        .viewer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1rem;
            padding: 1rem;
            background: #f8f8f7;
            flex: 1;
            overflow-y: auto;
        }

        .viewer-card {
            background-color: var(--card-bg);
            border: 1px solid #111827;
            border-radius: 0.85rem;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .preview-wrap {
            position: relative;
            flex: 1;
            min-height: 600px;
        }

        .preview-wrap iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .preview-loading,
        .preview-error {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 1.5rem;
            font-size: 0.86rem;
            color: var(--muted-color);
            background: #e5e7eb;
        }

        .preview-error {
            color: #b91c1c;
        }

        .file-info {
            padding: 0.75rem 1rem;
            background-color: #ffffff;
            border-bottom: 1px solid #111827;
            font-size: 0.86rem;
            color: var(--muted-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .file-info .file-name {
            font-weight: 600;
            color: var(--text-color);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .empty-state {
            padding: 3rem 1.5rem;
            text-align: center;
            color: var(--muted-color);
            grid-column: 1 / -1;
        }

        footer {
            text-align: center;
            padding: 0.9rem 1rem 1.25rem;
            font-size: 0.8rem;
            color: #6b7280;
            letter-spacing: 0.02em;
        }
    </style>
</head>
<body>

    <header>
        <h1>PDF 미리보기 &amp; 다운로드</h1>
        <div class="controls">
            <!-- 목록 새로고침 -->
            <button id="refreshBtn" class="btn btn-outline" type="button">
                새로고침
            </button>

            <!-- 컴퓨터에서 파일 변경하기 -->
            <label for="fileInput" class="btn btn-outline">
                내 컴퓨터에서 PDF 열기
            </label>
            <input type="file" id="fileInput" accept="application/pdf" multiple>
        </div>
    </header>

    <main>
        <div id="statusBar" class="status-bar">
            <span id="fileNameDisplay">docs 폴더의 PDF를 찾는 중...</span>
            <span>GitHub Pages Viewer</span>
        </div>
        <div class="viewer-container">
            <div id="viewerGrid" class="viewer-grid"></div>
        </div>
    </main>

    <footer>
        Hosted on GitHub Pages
    </footer>

    <script>
        const fileInput = document.getElementById('fileInput');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const statusBar = document.getElementById('statusBar');
        const viewerGrid = document.getElementById('viewerGrid');
        const refreshBtn = document.getElementById('refreshBtn');

        // ⚠️ 이 저장소/폴더 이름이 실제 GitHub 저장소와 다르면 아래 값을 수정하세요.
        const repoOwner = 'Podo3356';
        const repoName = 'Podo3356.github.io';
        const docsFolder = 'docs';
        const defaultPdfUrl = 'document.pdf';

        function setStatus(message, isError = false) {
            fileNameDisplay.textContent = message;
            statusBar.classList.toggle('is-error', isError);
        }

        // 파일명 안의 특수문자를 안전하게 다운로드 파일명으로 사용하기 위한 헬퍼
        function sanitizeFileName(name) {
            return name.endsWith('.pdf') ? name : `${name}.pdf`;
        }

        // 이번 렌더링에서 만들어진 blob URL들을 추적해서, 다음 렌더링 시 메모리 해제(revoke)한다.
        let activeBlobUrls = [];

        function revokeActiveBlobUrls() {
            activeBlobUrls.forEach((url) => URL.revokeObjectURL(url));
            activeBlobUrls = [];
        }

        // GitHub raw 서버가 PDF에 Content-Disposition: attachment 헤더를 붙여 내려주는 경우,
        // <iframe src="원본 URL">로 바로 열면 미리보기 대신 자동 다운로드가 발생한다.
        // 이를 막기 위해 fetch로 미리 받아 blob으로 변환한 뒤, 그 blob URL을 iframe/다운로드에 사용한다.
        async function fetchAsBlobUrl(url) {
            const response = await fetch(url);
            if (!response.ok) throw new Error('네트워크 응답 오류');
            const blob = await response.blob();
            const pdfBlob = blob.type === 'application/pdf' ? blob : blob.slice(0, blob.size, 'application/pdf');
            const blobUrl = URL.createObjectURL(pdfBlob);
            activeBlobUrls.push(blobUrl);
            return blobUrl;
        }

        // 다운로드 버튼 클릭 시에만 실제로 다운로드를 실행한다 (자동 다운로드 없음).
        // 이미 미리보기용으로 blob을 받아왔다면 그 blob을 그대로 재사용해 즉시 다운로드한다.
        async function downloadPdf(pdf, button) {
            const originalLabel = button.textContent;
            button.disabled = true;
            button.textContent = '다운로드 중...';

            try {
                const blobUrl = pdf.blobUrl || await fetchAsBlobUrl(pdf.url);
                pdf.blobUrl = blobUrl;

                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = sanitizeFileName(pdf.name);
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            } catch (error) {
                console.warn('블롭 다운로드 실패, 새 탭으로 열기:', error);
                window.open(pdf.url, '_blank', 'noopener');
            } finally {
                button.disabled = false;
                button.textContent = originalLabel;
            }
        }

        function createPdfCard(pdf) {
            const card = document.createElement('article');
            card.className = 'viewer-card';

            const info = document.createElement('div');
            info.className = 'file-info';

            const nameLabel = document.createElement('span');
            nameLabel.className = 'file-name';
            nameLabel.textContent = pdf.name;
            nameLabel.title = pdf.name;

            const downloadBtn = document.createElement('button');
            downloadBtn.type = 'button';
            downloadBtn.className = 'btn btn-primary btn-small';
            downloadBtn.textContent = '다운로드';
            downloadBtn.addEventListener('click', () => downloadPdf(pdf, downloadBtn));

            info.appendChild(nameLabel);
            info.appendChild(downloadBtn);

            const previewWrap = document.createElement('div');
            previewWrap.className = 'preview-wrap';

            const loadingLabel = document.createElement('div');
            loadingLabel.className = 'preview-loading';
            loadingLabel.textContent = '미리보기를 불러오는 중...';
            previewWrap.appendChild(loadingLabel);

            card.appendChild(info);
            card.appendChild(previewWrap);

            // pdf.isLocal(내 컴퓨터에서 선택한 파일)이면 이미 blob URL이라 바로 사용하고,
            // 그렇지 않으면(GitHub 원본 URL) fetch로 받아 blob으로 변환한 뒤 iframe에 연결한다.
            if (pdf.isLocal) {
                pdf.blobUrl = pdf.url;
                renderPreviewFrame(previewWrap, pdf);
            } else {
                fetchAsBlobUrl(pdf.url)
                    .then((blobUrl) => {
                        pdf.blobUrl = blobUrl;
                        renderPreviewFrame(previewWrap, pdf);
                    })
                    .catch((error) => {
                        console.warn(`"${pdf.name}" 미리보기 로드 실패:`, error);
                        previewWrap.innerHTML = '';
                        const errorLabel = document.createElement('div');
                        errorLabel.className = 'preview-error';
                        errorLabel.textContent = '미리보기를 불러오지 못했습니다. 다운로드 버튼으로 파일을 받아 확인해 주세요.';
                        previewWrap.appendChild(errorLabel);
                    });
            }

            return card;
        }

        function renderPreviewFrame(previewWrap, pdf) {
            previewWrap.innerHTML = '';
            const iframe = document.createElement('iframe');
            iframe.title = pdf.name;
            iframe.src = pdf.blobUrl;
            previewWrap.appendChild(iframe);
        }

        function renderPdfCards(pdfList) {
            revokeActiveBlobUrls();
            viewerGrid.innerHTML = '';

            if (!pdfList || !pdfList.length) {
                const empty = document.createElement('div');
                empty.className = 'empty-state';
                empty.textContent = 'docs 폴더에서 PDF 파일을 찾을 수 없습니다.';
                viewerGrid.appendChild(empty);
                setStatus('표시할 PDF가 없습니다.', true);
                return;
            }

            pdfList.forEach((pdf) => {
                viewerGrid.appendChild(createPdfCard(pdf));
            });

            setStatus(`총 ${pdfList.length}개의 PDF를 불러왔습니다.`, false);
        }

        async function loadPdfListFromDocs() {
            setStatus('docs 폴더의 PDF를 찾는 중...');
            try {
                const apiUrl = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/${encodeURIComponent(docsFolder)}`;
                const response = await fetch(apiUrl, {
                    headers: {
                        'Accept': 'application/vnd.github+json'
                    }
                });

                if (response.status === 403) {
                    throw new Error('GitHub API 요청 한도를 초과했습니다. 잠시 후 다시 시도해 주세요.');
                }
                if (response.status === 404) {
                    throw new Error(`"${docsFolder}" 폴더를 찾을 수 없습니다. 저장소/폴더 이름을 확인해 주세요.`);
                }
                if (!response.ok) {
                    throw new Error('docs 폴더 조회 실패');
                }

                const items = await response.json();
                const pdfs = Array.isArray(items)
                    ? items
                        .filter((item) => item.type === 'file' && item.name.toLowerCase().endsWith('.pdf'))
                        .map((item) => ({
                            name: item.name,
                            url: item.download_url || `https://raw.githubusercontent.com/${repoOwner}/${repoName}/main/${item.path}`
                        }))
                        .sort((a, b) => a.name.localeCompare(b.name))
                    : [];

                if (!pdfs.length) {
                    // API는 성공했지만 PDF가 없는 경우, 기본 파일이라도 시도해본다.
                    renderPdfCards([{ name: 'document.pdf', url: defaultPdfUrl }]);
                    return;
                }

                renderPdfCards(pdfs);
            } catch (error) {
                console.warn('docs pdf 자동 탐색 실패:', error);
                setStatus(error.message || 'PDF 목록을 불러오지 못했습니다. 기본 파일을 표시합니다.', true);
                renderPdfCards([{ name: 'document.pdf', url: defaultPdfUrl }]);
            }
        }

        refreshBtn.addEventListener('click', loadPdfListFromDocs);

        fileInput.addEventListener('change', function (e) {
            const files = Array.from(e.target.files || []).filter((f) => f.type === 'application/pdf');
            if (!files.length) {
                alert('PDF 파일만 선택이 가능합니다.');
                return;
            }
            const localPdfs = files.map((file) => ({
                name: file.name,
                url: URL.createObjectURL(file),
                isLocal: true
            }));
            renderPdfCards(localPdfs);
        });

        loadPdfListFromDocs();
    </script>
</body>
</html>
